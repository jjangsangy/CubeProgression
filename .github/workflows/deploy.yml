name: Deploy to GitHub Pages

on:
  # Trigger on a *single* workflow. `workflow_run` fires once per listed
  # workflow, so listing both "Test Runner" and "E2E Tests" starts this
  # workflow twice and lets an early "Test Runner" run deploy before the
  # E2E suite has finished. The unit-test jobs are gated below instead.
  workflow_run:
    workflows: ["E2E Tests"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  # Lets wait-on-check-action read the check runs of the other workflow.
  checks: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow deployments to complete.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      # "E2E Tests" reaching a successful conclusion only proves the E2E suite
      # passed. Wait atomically for the unit-test jobs ("Test Runner") and
      # lint/type checks ("Lint & Type Check") on the same commit as well before building.
      - name: Wait for tests and checks to pass
        if: ${{ github.event_name == 'workflow_run' }}
        uses: lewagon/wait-on-check-action@v1.9.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          check-regexp: '^(Test on .+|Lint & Type Check)$'
          checks-discovery-timeout: 300
          wait-interval: 10

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build project
        run: bun run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
