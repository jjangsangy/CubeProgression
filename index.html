<!doctype html>
<html lang="en" class="bg-stone-950" style="background-color: #0c0a09;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0a09" />
    <meta name="color-scheme" content="dark" />
    <title>CubeProgression</title>
    <meta name="description" content="Upload csTimer session logs to analyze solve time progression, moving averages, daily variance, distribution density shifts, and consistency metrics." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.webp" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CubeProgression" />
  </head>
  <body class="min-h-full bg-stone-950 text-stone-100" style="background-color: #0c0a09;">
    <div id="root">
      <div class="flex min-h-screen flex-col bg-stone-950 font-sans text-stone-100 antialiased" style="min-height: 100vh; background-color: #0c0a09; color: #f5f5f4;">
        <!-- Top Navigation Bar Skeleton (Matches Navbar.tsx 1:1) -->
        <header class="relative border-b border-stone-800 bg-stone-950" style="border-bottom: 1px solid #292524; background-color: #0c0a09;">
          <div class="mx-auto flex h-16 max-w-7xl items-center justify-between gap-4 px-4 sm:px-6 safe-area-x" style="height: 64px; max-width: 80rem; margin: 0 auto; display: flex; align-items: center; justify-content: space-between;">
            <div class="flex shrink-0 items-center">
              <img src="./favicon.svg" alt="CubeProgression Logo" width="40" height="40" class="h-10 w-10 shrink-0 rounded-xl shadow-lg shadow-amber-500/10" style="width: 2.5rem; height: 2.5rem; border-radius: 0.75rem;" />
              <h1 class="sr-only">CubeProgression</h1>
            </div>
          </div>
        </header>

        <!-- Main Container Skeleton (Matches App.tsx and FileUploader.tsx 1:1) -->
        <main class="mx-auto flex w-full max-w-7xl flex-1 flex-col gap-8 px-4 py-8 sm:px-6 safe-area-x" style="max-width: 80rem; margin: 0 auto; width: 100%; flex: 1; padding: 2rem 1rem; display: flex; flex-direction: column; gap: 2rem;">
          <div class="flex flex-col gap-6 rounded-2xl border border-stone-800 bg-stone-900 p-4 sm:p-6 text-stone-100 shadow-xl" style="border-radius: 1rem; border: 1px solid #292524; background-color: #1c1917; padding: 1rem;">
            <div class="grid grid-cols-1 items-stretch gap-6 lg:grid-cols-12" style="display: grid; grid-template-columns: 1fr; gap: 1.5rem;">
              <div class="lg:col-span-5 border-2 border-dashed border-amber-500/60 bg-stone-950/80 rounded-2xl p-5 flex flex-col items-center justify-center min-h-[250px]" style="border: 2px dashed rgba(245, 158, 11, 0.6); border-radius: 1rem; min-height: 250px; background-color: rgba(12, 10, 9, 0.8); display: flex; align-items: center; justify-content: center;">
                <div style="width: 2.5rem; height: 2.5rem; border-radius: 0.5rem; background-color: rgba(245, 158, 11, 0.2); border: 1px solid rgba(245, 158, 11, 0.4);"></div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
